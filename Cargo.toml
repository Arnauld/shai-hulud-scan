[package]
name = "shai-hulud-guard"
version = "0.1.1"
edition = "2021"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.5.61", features = ["derive"] }
console = "0.16.4"
csv = "1.4.0"
dirs = "6.0.0"
ignore = "0.4.30"
indicatif = "0.18.4"
regex = "1.13.1"
reqwest = { version = "0.13.3", default-features = false, features = ["rustls", "json", "charset", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
sha2 = "0.11.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs", "process", "sync", "time"] }
toml = "1.1.4"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"
